services:
  # Backend API Web Service (FastAPI)
  - type: web
    name: careerchain-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: careerchain/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: SQLITE_FALLBACK_URL
        value: sqlite:///./careerchain.db

  # Frontend Web App (React / Vite)
  - type: web
    name: careerchain-frontend
    runtime: static
    rootDir: careerchain/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: careerchain-backend
          property: url
